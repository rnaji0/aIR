version: 2
# C++ dependencies are pinned in cmake/Dependencies.cmake. Dependabot can't read
# FetchContent, so those are bumped by hand.
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: uv
    directory: /python
    schedule:
      interval: weekly
    groups:
      python:
        update-types: [minor, patch]
